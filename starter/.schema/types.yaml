# Each note type and the folder it lives in once it is filed.
# Group is a company, client, family or team. Place is a city, home or clinic. Thing is something the owner has. Topic is a subject that grows.
# Event is one dated visit, appointment or meeting. It shows in Today on its `date` until its status is done.
# Note covers meetings, references and small ideas. Tag it to say which.
# Goal is a big aim, with targets and wins. A goal with `parent` is a subgoal, one level deep only.
# Decision is one big choice, with rants, buckets, options and what was decided.
# `areas` lists 1 or more area slugs, like [health, money]. Goal and Decision need it. The old single `area` still reads.
# Journal is one journal entry, kept whole. `sorted: false` while it waits, then the date it was sorted.
# "inbox" means the note stays in inbox/ until someone changes its type.
types:
  Capture: inbox
  Project: projects
  Area: areas
  Person: people
  Group: groups
  Place: places
  Thing: things
  Topic: topics
  Event: events
  Note: resources
  Journal: journal
  Lens: me
  Goal: goals
  Decision: decisions

# Fields that only some values are allowed for.
status: [draft, stable, deprecated]
event_status: [upcoming, done, cancelled]
goal_status: [active, later, done]
decision_status: [open, decided, dropped]
outcome: [today, date, someday, waiting, keep, drop]

# Intake: thread states (threads are lines in lens notes), how much to write down per lens, and the lens names.
thread_status: [open, talked, parked, closed]
privacy: [full, headline, skip]
lenses: [now, day, people, values, wellbeing, story, identity, future, profile]

# A filed note (anywhere but inbox/) must have these fields.
filed_required: [title, description]
description_max: 150
